name: sky

on:
  schedule:
    # every 30 minutes; the scene follows the real sunrise/sunset in Seoul
    - cron: "7,37 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install renderer dependencies
        run: pip install --quiet numpy pillow

      - name: Render the scene for the current hour in Seoul
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/render.py now out/now.svg

      # Publish to a single-commit branch so main's history stays clean.
      - name: Publish
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/output/now.svg" -o current.svg && cmp -s now.svg current.svg; then
            echo "scene unchanged"; exit 0
          fi
          rm -f current.svg
          git add now.svg
          git commit -qm "sky: $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
