name: sky

on:
  schedule:
    # 00/06/12/18 KST, plus a retry 30 min later in case a run is skipped
    - cron: "0 3,9,15,21 * * *"
    - cron: "30 3,9,15,21 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the scene for the current hour in Seoul
        run: |
          h=$((10#$(TZ=Asia/Seoul date +%H)))
          if   [ $h -lt 6 ];  then s=dawn
          elif [ $h -lt 12 ]; then s=morning
          elif [ $h -lt 18 ]; then s=noon
          else                     s=evening
          fi
          echo "SCENE=$s" >> "$GITHUB_ENV"
          mkdir out && cp "assets/$s.svg" out/now.svg

      # Publish to a single-commit branch so main's history stays clean.
      - name: Publish
        working-directory: out
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add now.svg
          git commit -qm "sky: $SCENE"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
