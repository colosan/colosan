name: stage

on:
  schedule:
    - cron: "0 * * * *"   # hourly; switches day/night at 07:00 / 19:00 KST
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: stage
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.event_name != 'issues' ||
      startsWith(github.event.issue.title, 'guess:') ||
      github.event.issue.title == 'star'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply visitor issue
        if: github.event_name == 'issues'
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_USER: ${{ github.event.issue.user.login }}
          STAGE_SALT: ${{ secrets.STAGE_SALT }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: python scripts/handle_issue.py

      - name: Render stage
        run: python scripts/render.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || { git commit -m "stage: update" && git push; }

      - name: Reply and close issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          REPLY_FILE: ${{ runner.temp }}/reply.md
        run: |
          if [ -f "$REPLY_FILE" ]; then
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file "$REPLY_FILE"
          fi
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
