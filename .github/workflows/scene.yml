name: scene

on:
  schedule:
    - cron: "0 15 * * *"   # every day at 00:00 KST
  push:
    branches: [main]
    paths: [scripts/**]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render scene
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/render.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || { git commit -m "scene: redraw" && git push; }
